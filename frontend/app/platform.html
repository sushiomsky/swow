<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Wizard Of Wor — browser-based arcade game platform with singleplayer and multiplayer modes.">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index,follow">
    <link rel="stylesheet" href="/frontend/styles/shared.css">
    <link rel="stylesheet" href="/frontend/styles/platform.css">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preload" href="/images/v3.0/sprite.png" as="image">
    <title>Wizard Of Wor</title>
    <meta property="og:title" content="Wizard Of Wor">
    <meta property="og:type" content="game">
    <meta property="og:url" content="https://wizardofwor.duckdns.org/">
    <meta property="og:image" content="https://wizardofwor.duckdns.org/images/v2.0/wizard-of-wor-icon.png">
    <meta property="og:site_name" content="Wizard Of Wor">
    <meta property="og:description" content="Play the legendary 1983 arcade game in your browser — singleplayer or multiplayer. No install, no signup, just play!">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wizard Of Wor — Free Browser Arcade">
    <meta name="twitter:description" content="Score big in this classic 1983 arcade game. Challenge your friends!">
    <meta name="twitter:image" content="https://wizardofwor.duckdns.org/images/v2.0/wizard-of-wor-icon.png">
</head>
<body>
    <!-- Main menu overlay — shown when no game mode is active -->
    <div id="main-menu">
        <h1>WIZARD OF WOR</h1>
        <p class="subtitle">Browser-Arcade — sofort spielen</p>

        <button class="menu-play" id="menu-sp-1p">▶ SPIELEN</button>
        <p class="menu-play-hint">LEERTASTE oder ENTER drücken</p>

        <div class="menu-secondary">
            <button class="menu-btn-sm green" id="menu-sp-2p">2 SPIELER</button>
            <button class="menu-btn-sm blue" id="menu-mp">🌐 ONLINE</button>
            <button class="menu-btn-sm dark" id="menu-handbook">📖 HILFE</button>
        </div>

        <div class="menu-footer">
            <a id="menu-community-link" href="/community" target="_blank" rel="noopener">Community</a>
            <span class="menu-keys">SPACE · 2 · M · H</span>
        </div>
    </div>

    <!-- Game→Community-Rücklink: sichtbarer Community-Link auf der Game-Plattform.
         Absolut auf den Community-Host aufgelöst (kein relativer /community-Pfad,
         der am Game-Host :18080 ins Leere läuft — N-05). -->
    <script>
        (function () {
            // window.__SWOW_COMMUNITY_URL__ gewinnt, sonst gleicher Host + Community-Port,
            // sonst (Prod-Edge, gleiche Origin) relativer /community-Pfad.
            var base = window.__SWOW_COMMUNITY_URL__
                || ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                    ? window.location.protocol + '//' + window.location.hostname + ':13000/community'
                    : '/community');
            var link = document.getElementById('menu-community-link');
            if (link) link.href = base;
        })();
    </script>

    <!-- Game root — modes inject their DOM here -->
    <div id="game-root"></div>

    <script>
        // Signal to mode modules that they should NOT auto-init
        window.__SWOW_PLATFORM__ = true;
    </script>
    <script type="module">
        import { Platform } from '/frontend/app/Platform.js';
        const platform = new Platform();
        platform.init();
        window.__platform = platform;
    </script>
</body>
</html>
