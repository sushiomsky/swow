<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Verloren im Dungeon | Wizard of Wor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a12 radial-gradient(ellipse at 50% 30%, #1a1033 0%, #0a0a12 70%);
    color: #e8e8f0;
    font-family: "Courier New", ui-monospace, monospace;
    text-align: center; padding: 2rem;
  }
  .cabinet {
    border: 4px solid #7c3aed;
    border-radius: 18px;
    box-shadow: 0 0 40px #7c3aed88, inset 0 0 60px #000;
    background: #11111c;
    padding: 3rem 2.5rem;
    max-width: 560px; width: 100%;
  }
  .code {
    font-size: clamp(4rem, 15vw, 7rem);
    font-weight: bold; letter-spacing: .1em;
    color: #facc15;
    text-shadow: 0 0 12px #facc15, 0 0 40px #f59e0b, 4px 4px 0 #7c2d12;
    animation: blink 1.2s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: .75; } }
  h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; color: #fff; }
  .marquee {
    display: inline-block; margin-bottom: 1rem;
    padding: .3rem 1rem; border: 2px solid #22d3ee; border-radius: 999px;
    color: #22d3ee; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase;
    text-shadow: 0 0 8px #22d3ee;
  }
  p { color: #a1a1aa; font-size: .95rem; line-height: 1.6; }
  .score { color: #facc15; font-size: .85rem; margin-top: .75rem; letter-spacing: .15em; }
  a.btn {
    display: inline-block; margin-top: 1.75rem;
    padding: .9rem 2.2rem;
    background: #4f46e5; color: #fff; text-decoration: none;
    font-weight: bold; font-size: 1rem; letter-spacing: .05em;
    border-radius: 8px; border-bottom: 4px solid #312e81;
  }
  a.btn:hover { background: #6366f1; }
  a.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .hint { margin-top: 1rem; font-size: .75rem; color: #52525b; }
  .hint code { color: #71717a; }
</style>
</head>
<body>
  <div class="cabinet">
    <span class="marquee">&#9679; GAME OVER &#9679;</span>
    <div class="code">404</div>
    <h1>Verloren im Dungeon, Worrior?</h1>
    <p>Diese Kammer des Labyrinths existiert nicht (mehr). Kein Monster, kein Schatz &mdash; nur Leere.</p>
    <p class="score">SCORE 00404 &nbsp;&bull;&nbsp; CREDITS 01</p>
    <a class="btn" href="/">&#9654; ZUR&Uuml;CK ZUR LOBBY</a>
    <p class="hint">Tipp: &Uuml;ber die Lobby erreichst du Spiel, Bestenlisten und Community.</p>
  </div>
</body>
</html>
