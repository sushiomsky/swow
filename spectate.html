<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectate — Wizard of Wor</title>
    <link rel="stylesheet" href="/frontend/styles/shared.css">
    <link rel="stylesheet" href="/frontend/styles/spectator.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="spectator-container">
        <div id="spectator-header">
            <span class="spectator-label">👁 SPECTATING</span>
            <span id="dungeon-info"></span>
            <a href="/play" class="back-btn">← BACK TO LOBBY</a>
        </div>
        
        <canvas id="spectator-canvas"></canvas>
        
        <div id="spectator-overlay" class="overlay">
            <div class="overlay-content">
                <p id="overlay-message">Loading live games…</p>
            </div>
        </div>

        <!-- Game browser (shown when no dungeon ID specified) -->
        <div id="game-browser" class="hide">
            <h2>LIVE GAMES</h2>
            <p class="browser-subtitle">Select a game to spectate</p>
            <div id="game-list"></div>
            <p id="no-games" class="hide" style="color:#666; margin-top:20px;">No games running. Check back soon.</p>
        </div>
    </div>
    
    <!-- Load game assets and spectator client.
         NOTE: SpectatorClient lives in frontend/app/ (outside the mp-client
         scope) and its connect() opens the socket on the bare host, which
         serves HTTP only. The game server accepts WS upgrades solely on
         /multiplayer — so connect inline here with the correct path. -->
    <script type="module">
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/multiplayer`;

        const overlay = document.getElementById('spectator-overlay');
        const message = document.getElementById('overlay-message');
        const info = document.getElementById('dungeon-info');
        const canvas = document.getElementById('spectator-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        const urlParams = new URLSearchParams(window.location.search);
        // M-09: dungeon IDs are server-side strings; keep the raw string form
        // (numeric coercion would miss the internal Map lookup).
        const dungeonId = urlParams.get('dungeon');

        function showMessage(text) {
            if (message) message.textContent = text;
            if (overlay) overlay.classList.remove('hidden');
        }

        function updateInfo(state) {
            if (!state || !info) return;
            const playerCount = state.players?.length || 0;
            const level = state.level || 0;
            info.textContent = `Dungeon ${dungeonId} • ${playerCount} players • Level ${level}`;
        }

        function render(state) {
            if (!state) return;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('SPECTATOR MODE', canvas.width / 2, 50);
            ctx.font = '14px monospace';
            ctx.fillText(`Dungeon ${dungeonId}`, canvas.width / 2, 80);
            if (state.players) {
                let y = 120;
                ctx.fillText(`Players: ${state.players.length}`, canvas.width / 2, y);
                y += 30;
                state.players.forEach((player, i) => {
                    ctx.fillText(`P${i + 1}: Score ${player.score || 0} | Lives ${player.lives || 3}`, canvas.width / 2, y);
                    y += 25;
                });
            }
            if (state.monsters) ctx.fillText(`Monsters: ${state.monsters.length}`, canvas.width / 2, 240);
        }

        function connectSpectate() {
            showMessage('Connecting to game...');
            const ws = new WebSocket(wsUrl);
            window.spectator = { dungeonId, ws, disconnect: () => ws.close() };
            ws.onopen = () => ws.send(JSON.stringify({ type: 'spectate', dungeonId }));
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'spectate_init' || msg.type === 'spectate_state') {
                        updateInfo(msg.state);
                        render(msg.state);
                        overlay?.classList.add('hidden');
                    } else if (msg.type === 'spectate_error') {
                        showMessage(`❌ ${msg.message || 'Failed to spectate game'}`);
                    }
                } catch (_) { /* ignore malformed frames */ }
            };
            ws.onclose = () => showMessage('Disconnected. Reconnecting...');
            ws.onerror = () => showMessage('Connection error. Retrying...');
        }

        if (dungeonId) {
            connectSpectate();
        } else {
            // Show game browser
            document.getElementById('spectator-overlay').classList.add('hide');
            document.getElementById('game-browser').classList.remove('hide');
            loadGameBrowser();
        }

        async function loadGameBrowser() {
            const list = document.getElementById('game-list');
            const noGames = document.getElementById('no-games');
            try {
                const res = await fetch('/multiplayer/active-games');
                const data = await res.json();
                const games = data.games || [];
                if (!games.length) {
                    noGames.classList.remove('hide');
                    return;
                }
                const modeColors = {
                    endless: '#0cf', sitngo: '#f80',
                    'team-endless': '#0f0', 'team-sitngo': '#c6f',
                    private: '#888',
                };
                list.innerHTML = games.map(g => {
                    const color = modeColors[g.mode] || '#888';
                    // M-09: server sends `isBot`; the old `is_bot` key counted
                    // every player as human.
                    const humans = (g.players || []).filter(p => !p.isBot && !p.is_bot).length;
                    const bots = (g.players || []).filter(p => p.isBot || p.is_bot).length;
                    return `
                        <a class="game-card" href="/spectate.html?dungeon=${g.dungeon_id}">
                            <span class="game-mode" style="color:${color}">${(g.mode || '').toUpperCase()}</span>
                            <span class="game-level">Level ${g.level || 0}</span>
                            <span class="game-players">${humans}👤 ${bots}🤖</span>
                            <span class="game-watch">WATCH →</span>
                        </a>`;
                }).join('');
            } catch (e) {
                list.innerHTML = '<p style="color:#f55">Failed to load games.</p>';
            }
            // Auto-refresh every 10s
            setTimeout(loadGameBrowser, 10000);
        }
    </script>
</body>
</html>
