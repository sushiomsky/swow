services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: node server.js
    environment:
      PORT: 8080
      MP_HOST: multiplayer
      MP_PORT: 5001
    ports:
      - "${WEB_PUBLIC_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  multiplayer:
    build:
      context: .
      dockerfile: Dockerfile
    command: node server-multiplayer.js
    environment:
      MP_PORT: 5001
    ports:
      - "${MULTIPLAYER_PUBLIC_PORT:-15001}:5001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5001/multiplayer.html').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wow_community
      POSTGRES_USER: postgres
      # Hardening: kein Default-Passwort im Repo — per .env setzen.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wow_community"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  community-api:
    build:
      context: ./community-api
      dockerfile: Dockerfile
    environment:
      COMMUNITY_API_PORT: 7000
      # Hardening: kein Default mehr — ohne gesetztes Secret startet die API
      # nicht (fail-fast in config.js). :? erzwingt das beim Compose-Start.
      COMMUNITY_JWT_SECRET: ${COMMUNITY_JWT_SECRET:?COMMUNITY_JWT_SECRET must be set in .env}
      COMMUNITY_ALLOW_DEV_AUTH: ${COMMUNITY_ALLOW_DEV_AUTH:-false}
      COMMUNITY_EXPOSE_AUTH_FLOW_TOKENS: ${COMMUNITY_EXPOSE_AUTH_FLOW_TOKENS:-false}
      COMMUNITY_DATABASE_URL: postgres://postgres:postgres@postgres:5432/wow_community
      COMMUNITY_REDIS_URL: redis://redis:6379
    ports:
      - "${COMMUNITY_API_PUBLIC_PORT:-17000}:7000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  community-web:
    build:
      context: ./community-web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* wird zur Build-Zeit eingebacken. Ohne explizite ARGs
        # griffen die localhost-Fallbacks ins Prod-HTML (P0) — daher Defaults,
        # die auf dem Edge (gleiche Origin) funktionieren:
        #  - GAME_BASE leer => relative /multiplayer.html, /spectate.html, /index.html
        #  - API/Socket relativ => Same-Origin (/api/community, /socket.io)
        NEXT_PUBLIC_GAME_BASE: ${NEXT_PUBLIC_GAME_BASE:-}
        NEXT_PUBLIC_COMMUNITY_API_BASE: ${NEXT_PUBLIC_COMMUNITY_API_BASE:-/api/community}
        NEXT_PUBLIC_COMMUNITY_SOCKET_URL: ${NEXT_PUBLIC_COMMUNITY_SOCKET_URL:-}
        NEXT_PUBLIC_ACTIVE_GAMES_URL: ${NEXT_PUBLIC_ACTIVE_GAMES_URL:-/multiplayer/active-games}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://wizardofwor.duckdns.org}
    environment:
      # Server-side Next rewrite target (container DNS). Local dev without
      # Docker can override with COMMUNITY_API_INTERNAL_BASE=http://localhost:17000/api/community
      COMMUNITY_API_INTERNAL_BASE: ${COMMUNITY_API_INTERNAL_BASE:-http://community-api:7000/api/community}
      # Hinweis: NEXT_PUBLIC_* wird zur BUILD-Zeit eingebacken (siehe build.args
      # oben) — Runtime-environment wirkt auf Client-Bundles NICHT. Deshalb hier
      # keine NEXT_PUBLIC_*-Einträge (alte localhost-Werte aus .env griffen im
      # Browser ins Leere und sind bewusst entkoppelt).
    ports:
      - "${COMMUNITY_WEB_PUBLIC_PORT:-13000}:3000"
    depends_on:
      community-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  edge:
    image: caddy:2.9
    profiles: ["edge"]
    depends_on:
      web:
        condition: service_healthy
      multiplayer:
        condition: service_healthy
      community-api:
        condition: service_healthy
      community-web:
        condition: service_healthy
    ports:
      - "${EDGE_BIND_IP:-0.0.0.0}:${EDGE_HTTP_PORT:-10080}:80"
      - "${EDGE_BIND_IP:-0.0.0.0}:${EDGE_HTTPS_PORT:-10443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
